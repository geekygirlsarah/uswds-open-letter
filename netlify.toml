# Netlify build configuration.
#
# `npm run build` runs the Sass compile and the USWDS asset copy via prebuild,
# then Eleventy, then check-css-classes as postbuild. Output is _site/.

[build]
  command = "npm run build"
  publish = "_site"

[build.environment]
  NODE_VERSION = "20"
  # Used by lib/is-external-link.mjs to decide which links are external, so
  # in-page and same-site links never get the external-link icon.
  SITE_URL = "https://example.org"

# ------------------------------------------------------------------
# Caching
# ------------------------------------------------------------------
# Fonts carry the USWDS version in their path (/fonts/3.14.0/...), so a version
# bump produces new URLs and these can be cached forever.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The stylesheet URL does not change when its contents do, so it must not be
# cached immutably. Revalidate every time: Netlify answers with a 304 and an
# ETag, which is cheap, and a stale stylesheet would mean stale USWDS markup.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ------------------------------------------------------------------
# Security headers
# ------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # The site ships no JavaScript. style-src and font-src are 'self' because
    # the USWDS stylesheet and webfonts are both served from this origin. If
    # JavaScript is ever added, script-src needs to be opened deliberately.
    #
    # The contact page uses mailto: links, which form-action does not cover, but
    # mailto is a navigation rather than a fetch, so no directive is needed for
    # it to work. CSP does not block clicking a mailto link.
    Content-Security-Policy = "default-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'"

# ------------------------------------------------------------------
# Convenience redirects
# ------------------------------------------------------------------
[[redirects]]
  from = "/letter"
  to = "/letter.txt"
  status = 301

[[redirects]]
  from = "/data"
  to = "/archive.json"
  status = 301
