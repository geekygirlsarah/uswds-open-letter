# Please do not hand-edit this file to add yourself. Run:
#
#     npm run sign -- --name "Your Name" --role "Your Role"
#
# It appends your entry, formats the file, and opens a pull request. The why is
# in CONTRIBUTING.md.
#
# Rules (enforced by `npm run lint:signatories` in CI):
