#   - no two entries may share a name + role combination.
#   - entries are sorted by name, so the file has a stable order and adding
#     someone at the end of the alphabet produces a small diff.
#
# Signing does not imply that your current or former employer endorses this
# letter. If that distinction matters for you, say so in your `role` line, e.g.
# `role: "Product designer, former 18F"`.

